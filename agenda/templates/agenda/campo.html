<div class="form-field{% if field.field.widget.input_type == 'checkbox' %} checkbox-field{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label for="{{ field.id_for_label }}">{{ field }} {{ field.label }}</label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-marker" aria-hidden="true"> *</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_error">{% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
